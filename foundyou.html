<!DOCTYPE html>
<html>
<head>
    <title>Found You</title>
    <style>
        body {
            background: black;
            color: rgb(130, 130, 130);
            font-family: "Courier New", monospace;
            padding: 0;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        #container {
            position: relative;
            z-index: 2;
            padding: 40px;
        }

        h1 {
            font-size: 40px;
            text-shadow: 0 0 10px rgb(130, 130, 130);
        }

        #ip {
            font-size: 28px;
            margin-top: 20px;
        }

        /* Creepy smile image */
        #smile {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: cover;
            opacity: 0;
            transition: opacity 5s ease;
            pointer-events: none;
            filter: brightness(90%) contrast(150%) grayscale(100%);
            z-index: 1;
        }
    </style>
</head>
<body>

<!-- Creepy smile image (you can replace the src with a scarier one) -->
<img id="smile" src="https://www.shutterstock.com/image-illustration/creepy-looking-figure-smiling-dark-600nw-2348912379.jpg">

<div id="container">
    <h1 class="glitch">I found you.</h1>
    <p id="ip">...</p>
</div>

<script>
fetch("https://api.ipify.org?format=json")
  .then(res => res.json())
  .then(data => {
      document.getElementById("ip").innerText = "Your IP: " + data.ip;

      // Fade in the creepy smile after IP appears
      setTimeout(() => {
          document.getElementById("smile").style.opacity = "0.25";
      }, 1500);
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css"/>
</head>
<body>
		<p id=count>0</p>
		<button onclick=clicker()>press it</button>
		<button onclick=upgrader()>upgrader</button>
		<script>
			var cost = 50
			var score = 0
			var upgrade = 1
			function clicker() {
				score += upgrade
				document.getElementById("count").innerText = score;
				console.log(score);
			}
			
			function upgrader() {
                if (score > cost) {
                    score -= cost;
                    upgrade += 1;
					cost *= 3;
                    console.log("it yeah")
                }
			}

    </script>
</body>
</html>
